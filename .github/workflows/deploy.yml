name: build & deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Build
        run: node build.mjs
      - name: Deploy to samsiani.me
        if: github.ref == 'refs/heads/main'
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          [ -n "$KEY" ] || { echo "VPS_SSH_KEY secret is not set — skipping deploy"; exit 0; }
          mkdir -p ~/.ssh && printf '%s\n' "$KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 194.163.189.230 >> ~/.ssh/known_hosts 2>/dev/null
          rsync -az --delete -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no" \
            dist/ root@194.163.189.230:/home/samsiani.me/public_html/
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no root@194.163.189.230 \
            'chown -R samsi7128:samsi7128 /home/samsiani.me/public_html && find /home/samsiani.me/public_html -type d -exec chmod 755 {} + && find /home/samsiani.me/public_html -type f -exec chmod 644 {} +'
