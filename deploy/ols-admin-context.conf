# Applied once, by hand, as root, to the OpenLiteSpeed vhost.conf of the domain (docs/plans/admin-ops.md §8.1).
# The existing static `context /` (location, extraHeaders, rewrite), `errorpage 404` and `expires` blocks
# stay exactly as they are. Back up first: cp -a vhost.conf vhost.conf.bak.pre-admin-$(date +%F)

# 1. After the vhost-level settings, before the first `context`:
# ---- samsiani.me admin: Node service on 127.0.0.1:3097 ----------------------
extprocessor samsianiadmin {
  type                    proxy
  address                 http://127.0.0.1:3097
  maxConns                10
  pcKeepAliveTimeout      60
  initTimeout             60
  retryTimeout            0
  respBuffer              0
}

# 2. Above `context /`:
context /admin/ {
  type                    proxy
  handler                 samsianiadmin
  addDefaultCharset       off
}
# ------------------------------------------------------------------------------

# 3. Inside the existing `rewrite { }` of `context /`, as its first rule. If that block has only
#    `enable 1`, add the rules block after it:
#      rules                 <<<END_rules
#    RewriteRule ^/?admin$ /admin/ [R=301,L]
#      END_rules
#
# Then: /usr/local/lsws/bin/lswsctrl restart   (graceful)
# If CyberPanel regenerates vhost.conf and drops this block, the admin disappears while the public site
# keeps working; re-apply this file. The deploy's vhost probe warns when that happens.
